<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<!-- stará adresa (GitHub Pages): smazat stará data trackeru v tomhle prohlížeči a poslat na novou adresu -->
<script>if(location.hostname==='jendovyapky.github.io'){try{for(var k of Object.keys(localStorage))if(/^(trackerrr_|last_notif_|app_tracker_state)/.test(k))localStorage.removeItem(k)}catch(e){}location.replace('https://tracker.jendovyapky.eu/')}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Trackerrr</title>
<meta name="description" content="Trackerrr – pití, suplementy a recenze jídla na jednom místě.">
<meta name="theme-color" content="#0b0c10">
<meta name="color-scheme" content="dark">
<style>html{background:#0b0c10;color-scheme:dark}</style>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- „black“, ne „black-translucent“: iOS 26 jinak nechá u appky z plochy dole pás (viz Qamera) -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Trackerrr">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap&subset=latin-ext" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="tint" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<!-- úvod: kapka otevře oči a appka se vynoří -->
<div class="boot" id="boot" aria-hidden="true">
  <div class="boot__in">
    <img class="boot__logo" src="icons/logo.png" alt="">
  </div>
</div>

<header class="top">
  <div class="top__l">
    <h1 id="title">PŘEHLED</h1>
    <p id="subtitle" class="top__sub">dnes</p>
  </div>
  <button class="battery" id="battery" type="button" data-act="battery" aria-label="Kolik zbývá ze dne">
    <i id="batteryFill"></i><span id="batteryText">100%</span>
  </button>
  <div class="top__r">
    <button class="ibtn" id="syncBtn" type="button" data-act="sync" aria-label="Synchronizace"></button>
    <button class="ibtn" type="button" data-act="settings" aria-label="Nastavení"></button>
  </div>
</header>

<main class="wrap">
  <div class="pastbar" id="pastBar" hidden>
    <span id="pastText">Díváš se na jiný den</span>
    <button type="button" data-act="today">Zpět na dnešek</button>
  </div>
  <section class="view" id="view-home"></section>
  <section class="view" id="view-water" hidden></section>
  <section class="view" id="view-supps" hidden></section>
  <section class="view" id="view-food" hidden></section>
  <section class="view" id="view-stats" hidden></section>
</main>

<nav class="dock" id="dock" aria-label="Hlavní menu">
  <button type="button" data-act="tab" data-tab="home" aria-label="Přehled"></button>
  <button type="button" data-act="tab" data-tab="water" aria-label="Pití"></button>
  <button type="button" data-act="tab" data-tab="supps" aria-label="Suplementy"></button>
  <button type="button" data-act="tab" data-tab="food" aria-label="Jídlo"></button>
  <button type="button" data-act="tab" data-tab="stats" aria-label="Statistiky"></button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet__bg" data-act="closeSheet"></div>
  <div class="sheet__box" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet__grab" id="sheetGrab"></div>
    <div class="sheet__head"><h2 id="sheetTitle"></h2><button class="ibtn" type="button" data-act="closeSheet" aria-label="Zavřít"></button></div>
    <div class="sheet__body" id="sheetBody"></div>
  </div>
</div>

<input type="file" id="importFile" accept=".json,application/json" hidden>
<script src="app.js"></script>
</body>
</html>
